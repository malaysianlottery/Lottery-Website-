<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysian Lottery - Premium Live 4D Portal</title>
    <style>
        /* ===== GLOBAL RESET & STRICT SANS-SERIF TYPOGRAPHY ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #FFD700;
            --deep-gold: #C5A059;
            --luxury-gold: #ECC844;
            --pure-black: #000000;
            --card-black: #0b0b0a;
            --bright-white: #ffffff;
            --neon-green: #00FF66;
            --neon-blue: #00E5FF;
            --neon-red: #FF3333;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--pure-black); 
            color: var(--bright-white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 10;
        }

        /* ===== HIGH-CONTRAST NAVIGATION BAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.98);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 3px solid var(--primary-gold);
            box-shadow: 0 4px 25px rgba(255, 215, 0, 0.25);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav a {
            color: var(--bright-white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        nav a:hover {
            color: var(--primary-gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .lang-selector-box {
            background: var(--card-black);
            border: 2px solid var(--primary-gold);
            color: var(--bright-white);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
        }

        /* ===== BANNER VIEWPORT WITH EXACT TEXT ALIGNMENT ===== */
        .hero-view-port {
            margin-top: 85px; 
            width: 100%;
            max-width: 1400px; 
            margin-left: auto;
            margin-right: auto;
            position: relative;
            background: var(--pure-black); 
            border: 3px solid var(--primary-gold);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.15);
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            background: var(--pure-black);
        }

        .full-slide-layer.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            filter: brightness(0.4) contrast(1.1);
        }

        /* ===== SLIDER CENTERED TEXT (LINE BREAK & SPACING UPDATED) ===== */
        .slide-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            text-align: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease-in-out 0.2s;
        }

        .full-slide-layer.active .slide-text-overlay {
            opacity: 1;
        }

        .slide-text-overlay h1 {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.95), 0 0 40px rgba(255, 215, 0, 0.6);
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.2;
        }

        .slide-text-overlay h1 span {
            display: block;
        }

        /* ===== COMMON SECTION TITLE ===== */
        .section-title {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: var(--primary-gold);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* ===== ABOUT PROFILE SECTION ===== */
        .profile-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .profile-image-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid var(--primary-gold);
            margin: 0 auto;
            background: var(--pure-black);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .profile-logo-overlay {
            position: absolute;
            width: 75%;
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .profile-info h2 {
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .profile-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            color: var(--primary-gold);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 800;
            border: 2px solid var(--primary-gold);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }

        .profile-info p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #eeeeee;
            margin-bottom: 1.5rem;
        }

        .condition-highlight {
            border-left: 5px solid var(--primary-gold);
            background: #0d0d0d;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border-radius: 0 8px 8px 0;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .condition-highlight strong {
            color: var(--primary-gold);
            display: block;
            margin-bottom: 0.4rem;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .stat-item {
            background: var(--card-black);
            padding: 1.5rem;
            border-radius: 6px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-top: 4px solid var(--primary-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* ===== PREMIUM SERVICES ===== */
        .services-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .services-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .service-card {
            background: var(--card-black);
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.25);
            padding: 2.5rem 1.5rem;
            text-align: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .service-card:hover {
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .game-logo-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary-gold);
            background: var(--pure-black);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .game-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-card h3 { 
            color: var(--primary-gold); 
            font-size: 1.5rem; 
            margin-bottom: 0.8rem; 
            font-weight: 900; 
            text-transform: uppercase;
        }
        
        .service-card p { 
            color: #dddddd; 
            font-size: 1rem; 
            line-height: 1.6; 
        }

        /* ===== DIGITAL LIVE SCREEN ARENA ===== */
        .results-section {
            padding: 6rem 2rem;
            position: relative;
            background: var(--pure-black);
            overflow: hidden;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }
