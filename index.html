<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>উইনার্স গেম প্রোফাইল</title>
    <style>
        /* আপনার ওয়েবসাইটের ডিজাইন সুন্দর করার জন্য কিছু বেসিক সিএসএস */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
        }
        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="profile.jpg" alt="প্রোফাইল পিকচার" class="profile-pic">

        <h2>স্বাগতম, গেমার!</h2>
        <p>নিচের লিংকে ক্লিক করে উইনার্সদের গেমে প্রবেশ করুন।</p>

        <a href="https://www.example.com/game" target="_blank" class="btn">গেম ওপেন করুন</a>
    </div>

</body>
</html>
