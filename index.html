<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysian Lottery - Premium Live 4D Portal</title>
    <style>
        /* ===== GLOBAL RESET & STRICT SANS-SERIF TYPOGRAPHY ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* আরও লাক্সারিয়াস ও প্রমিনেন্ট গোল্ডেন কালার প্যালেট */
            --primary-gold: #FFD700;
            --bright-gold: #FFDF00;
            --deep-gold: #E6B800;
            --gold-glow: rgba(255, 223, 0, 0.4);
            --pure-black: #000000;
            --card-black: #0d0d0d;
            --bright-white: #ffffff;
            --neon-green: #00FF66;
            --neon-blue: #00E5FF;
            --neon-red: #FF3333;
            --messenger-color: #0084FF;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--pure-black); 
            color: var(--bright-white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 10;
        }

        /* ===== HIGH-CONTRAST NAVIGATION BAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.98);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 3.5px solid var(--bright-gold);
            box-shadow: 0 4px 25px rgba(255, 223, 0, 0.25);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--bright-gold);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav a {
            color: var(--bright-white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--bright-gold);
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .lang-selector-box {
            background: var(--card-black);
            border: 2px solid var(--bright-gold);
            color: var(--bright-white);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 5px var(--gold-glow);
        }

        /* ===== BANNER VIEWPORT WITX EXACT TEXT ALIGNMENT ===== */
        .hero-view-port {
            margin-top: 85px; 
            width: 100%;
            max-width: 1400px; 
            margin-left: auto;
            margin-right: auto;
            position: relative;
            background: var(--pure-black); 
            border: 3.5px solid var(--bright-gold);
            box-shadow: 0 0 30px rgba(255, 223, 0, 0.15);
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            background: var(--pure-black);
        }

        .full-slide-layer.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* ===== SLIDER CENTERED LINE-BY-LINE TEXT ===== */
        .slide-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            text-align: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s ease-in-out 0.2s;
        }

        .full-slide-layer.active .slide-text-overlay {
            opacity: 1;
        }

        .slide-text-overlay h1 {
            font-size: 4.2rem;
            font-weight: 900;
            color: var(--bright-gold);
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.95), 0 0 40px rgba(255, 223, 0, 0.6);
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 1.3; /* লাইনগুলোর মধ্যে সামঞ্জস্য বজায় রাখার জন্য */
        }

        /* ===== COMMON SECTION TITLE ===== */
        .section-title {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: var(--bright-gold);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 223, 0, 0.2);
        }

        /* ===== ABOUT PROFILE SECTION ===== */
        .profile-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 223, 0, 0.3);
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .profile-image-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            border: 3.5px solid var(--bright-gold);
            margin: 0 auto;
            background: var(--pure-black);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .profile-logo-overlay {
            position: absolute;
            width: 75%;
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .profile-info h2 {
            font-size: 3rem;
            color: var(--bright-gold);
            margin-bottom: 0.5rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .profile-badge {
            display: inline-block;
            background: rgba(255, 223, 0, 0.15);
            color: var(--bright-gold);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 800;
            border: 2px solid var(--bright-gold);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 223, 0, 0.2);
        }

        .profile-info p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #eeeeee;
            margin-bottom: 1.5rem;
        }

        .condition-highlight {
            border-left: 5px solid var(--bright-gold);
            background: #0d0d0d;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border-radius: 0 8px 8px 0;
            border: 1px solid rgba(255, 223, 0, 0.3);
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.05);
        }

        .condition-highlight strong {
            color: var(--bright-gold);
            display: block;
            margin-bottom: 0.4rem;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .stat-item {
            background: var(--card-black);
            padding: 1.5rem;
            border-radius: 6px;
            text-align: center;
            border: 2px solid rgba(255, 223, 0, 0.25);
            border-top: 4px solid var(--bright-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--bright-gold);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* ===== PREMIUM SERVICES ===== */
        .services-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 223, 0, 0.3);
        }

        .services-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .service-card {
            background: var(--card-black);
            border-radius: 12px;
            border: 2px solid rgba(255, 223, 0, 0.25);
            padding: 2.5rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            border-color: var(--bright-gold);
            box-shadow: 0 0 20px rgba(255, 223, 0, 0.15);
            transform: translateY(-2px);
        }

        .game-logo-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--bright-gold);
            background: var(--pure-black);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .game-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-card h3 { 
            color: var(--bright-gold); 
            font-size: 1.5rem; 
            margin-bottom: 0.8rem; 
            font-weight: 900; 
            text-transform: uppercase;
        }
        
        .service-card p { 
            color: #dddddd; 
            font-size: 1rem; 
            line-height: 1.6; 
        }

        /* ===== DIGITAL LIVE SCREEN ARENA ===== */
        .results-section {
            padding: 6rem 2rem;
            position: relative;
            background: var(--pure-black);
            overflow: hidden;
            border-bottom: 2px solid rgba(255, 223, 0, 0.3);
        }

        .results-section-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('1000014883.png') no-repeat center center;
            background-size: cover;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }

        .live-arena-viewport {
            position: relative;
            z-index: 5;
            max-width: 950px;
            margin: 3rem auto 0 auto;
            background: #000000;
            border: 5px solid var(--bright-gold);
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: 0 0 50px rgba(255, 223, 0, 0.3);
        }

        .live-header-ticker {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--bright-gold);
            padding-bottom: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .live-status-tag {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 0, 0, 0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            border: 2px solid var(--neon-red);
            font-size: 1rem;
            font-weight: 900;
            color: var(--neon-red);
            text-transform: uppercase;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background-color: var(--neon-red);
            border-radius: 50%;
            animation: pulseBlink 0.8s infinite alternate;
        }

        @keyframes pulseBlink {
            0% { opacity: 0.2; }
            100% { opacity: 1; box-shadow: 0 0 15px var(--neon-red); }
        }

        .live-timer-sync {
            font-size: 1.1rem;
            color: var(--neon-blue);
            font-weight: 900;
            text-transform: uppercase;
        }

        .live-slideshow-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        .live-result-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-in-out;
        }

        .live-result-slide.active {
            opacity: 1;
            visibility: visible;
        }

        .live-op-name {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--bright-white);
            letter-spacing: 2px;
            margin-bottom: 0px;
            line-height: 1;
        }

        .live-lucky-num {
            font-size: 7.5rem; 
            font-weight: 900; 
            color: var(--bright-gold);
            letter-spacing: 4px;
            line-height: 0.9; 
            margin: 5px 0;
            text-shadow: 0 0 25px rgba(255, 223, 0, 0.4);
        }

        .live-status-txt {
            font-size: 1.2rem;
            color: var(--neon-green);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1;
        }

        /* ===== PREVIOUS WINNING GAMES SYSTEM ===== */
        .portfolio-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 223, 0, 0.3);
        }

        .portfolio-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .portfolio-card {
            background: var(--card-black);
            border-radius: 12px;
            border: 3px solid rgba(255, 223, 0, 0.3);
            text-align: center;
            padding: 2.5rem;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .portfolio-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--bright-gold);
            box-shadow: 0 10px 25px rgba(255, 223, 0, 0.25);
        }
        
        .portfolio-card h3 { 
            color: var(--bright-gold); 
            font-size: 1.6rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin-top: 0.5rem;
        }
        
        .portfolio-card p { 
            font-size: 1.1rem; 
            color: var(--bright-white); 
            margin-top: 0.4rem; 
            font-weight: 700;
        }
        
        .portfolio-card .click-hint {
            font-size: 0.8rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 1rem;
            letter-spacing: 1px;
        }

        /* ===== WINNERS MODAL PLATFORM ===== */
        .winners-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 5000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .winners-modal-window {
            background: #080808;
            border: 3px solid var(--bright-gold);
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            border-radius: 16px;
            overflow-y: auto;
            position: relative;
            padding: 3rem 2rem;
            box-shadow: 0 0 50px rgba(255, 223, 0
