<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Malaysian Lottery - Premium Live 4D Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== GLOBAL RESET & HIGH-END GOLDEN VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-gold: #FFDF00;     /* Ultra Bright Premium Gold */
            --deep-gold: #D4AF37;        /* Classic Metallic Gold */
            --dark-gold: #996515;        /* Luxury Shadow Gold */
            --pure-black: #000000;
            --card-black: #0d0d11;
            --bright-white: #ffffff;
            --neon-green: #39FF14;
            --neon-blue: #00E5FF;
            --neon-red: #FF3333;
            --gold-glow: rgba(255, 223, 0, 0.35);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: var(--pure-black); 
            color: var(--bright-white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 10;
        }

        /* ===== DEEP GOLDEN HIGH-CONTRAST NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 3px solid var(--primary-gold);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(255, 223, 0, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--gold-glow));
            background: #111; /* Fallback background for logo image */
            border-radius: 50%;
        }

        .logo span {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF, var(--primary-gold), var(--deep-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav a {
            color: var(--bright-white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-gold);
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .lang-selector-box {
            background: var(--card-black);
            border: 2px solid var(--primary-gold);
            color: var(--bright-white);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 5px var(--gold-glow);
        }

        /* ===== HERO AREA WITH MULTI-LINE CENTERED TEXT ===== */
        .hero-view-port {
            margin-top: 85px; 
            width: 100%;
            max-width: 1400px; 
            margin-left: auto;
            margin-right: auto;
            position: relative;
            background: #111116; /* Dark slate fallback color to prevent blank screens */
            border: 3px solid var(--primary-gold);
            box-shadow: 0 0 30px var(--gold-glow);
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
            background: #111116;
        }

        .full-slide-layer.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
            background: #111116;
        }

        /* 4-Line Break Layout Engine Configuration */
        .slide-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
        }

        .full-slide-layer.active .slide-text-overlay {
            opacity: 1;
        }

        .slide-text-overlay h1 {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1.15;
            color: var(--bright-white);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.95);
        }

        /* Individual Line Break Highlights */
        .slide-text-overlay h1 span {
            display: block;
            background: linear-gradient(135deg, #FFF, var(--primary-gold), var(--deep-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
        }

        /* ===== COMMON GOLDEN HEADLINE HEADER ===== */
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FFF, var(--primary-gold), var(--deep-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* ===== ABOUT PROFILE DATA MATRIX ===== */
        .profile-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 223, 0, 0.25);
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

            position: relative;
            width:
