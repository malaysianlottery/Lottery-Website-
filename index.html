<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysian Lottery - Premium 4D Results & Services</title>
    <style>
        /* ===== GLOBAL RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #FFD700;
            --deep-gold: #C5A059;
            --dark-black: #111111;
            --luxury-dark: #1a1a1a;
            --white: #ffffff;
            --card-bg: #222222;
            --accent-blue: #00CCFF;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Times New Roman', Times, Georgia, serif;
            background: #0d0d0d; 
            color: var(--white);
            overflow-x: hidden;
            scroll-behavior: smooth;
            position: relative;
        }

        /* ===== BACKGROUND TINY PARTICLES (খুবই ছোট ও ক্ষুদ্র কণা) ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(1px 1px at 10% 20%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1.5px 1.5px at 30% 70%, rgba(255, 215, 0, 0.3) 100%, transparent),
                radial-gradient(1px 1px at 50% 40%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.2px 1.2px at 70% 80%, rgba(255, 215, 0, 0.3) 100%, transparent),
                radial-gradient(1px 1px at 90% 30%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1.5px 1.5px at 25% 15%, rgba(255, 215, 0, 0.3) 100%, transparent),
                radial-gradient(1px 1px at 60% 85%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.2px 1.2px at 85% 65%, rgba(255, 215, 0, 0.2) 100%, transparent);
            background-size: 300px 300px;
            animation: particleAnimation 25s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes particleAnimation {
            from { background-position: 0 0; }
            to { background-position: 0 -300px; }
        }

        /* কন্টেন্ট যেন পার্টিকেলের উপরে থাকে */
        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 2;
        }

        /* ===== NAVIGATION BAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #111111;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(197, 160, 89, 0.2);
            border-bottom: 2px solid var(--deep-gold);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 50px;
            width: 50px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
        }

        .logo span {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-gold);
        }

        .hero-view-port {
            margin-top: 75px;
            width: 100%;
            height: 550px; /* ডেস্কটপ স্ট্যান্ডার্ড রেসপন্সিভ হাইট */
            position: relative;
            background: #000000; 
            border-bottom: 3px solid var(--deep-gold);
            overflow: hidden;
        }

            width: 100%;
            height: 100%;
        }
