<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysian Lottery - Luxury Platform</title>
    <style>
        /* জেনারেল লাক্সারি স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b; /* ডার্ক ব্ল্যাক ব্যাকগ্রাউন্ড */
            color: #e5e5e5;
            padding-top: 70px;
        }
        
        /* রাজকীয় হেডার ও নেভিগেশন বার */
        header {
            background: linear-gradient(145deg, #141414, #1f1f1f);
            color: #d4af37; /* গোল্ডেন কালার */
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 2px solid #d4af37; /* গোল্ডেন বর্ডার */
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
            height: 60px;
        }
        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #d4af37, #f3e5ab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            list-style: none;
        }
        .nav-links li a {
            color: #f3e5ab;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links li a:hover {
            color: #fff;
            background: linear-gradient(90deg, #d4af37, #aa7c11);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* থ্রি-লাইন (Hamburger) মেনু স্টাইল */
        .hamburger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
        }
        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: #d4af37;
            transition: 0.3s;
            display: block;
        }

        /* প্রিমিয়াম সেকশন স্টাইল */
        section {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 30px auto;
            background: rgba(25, 25, 25, 0.85); /* সেমি-ট্রান্সপারেন্ট ব্ল্যাক */
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .section-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #d4af37, #f3e5ab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #aa7c11, #d4af37, #aa7c11);
            margin: 10px auto 0 auto;
            border-radius: 2px;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: #cccccc;
            text-align: justify;
        }

        /* প্রিভিয়াস উইনারস লাক্সারি গ্রিড */
        .winners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .winner-card {
            background: linear-gradient(145deg, #1a1a1a, #242424);
            border: 1px solid #44320b; /* হালকা গোল্ডেন বর্ডার */
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .winner-card:hover {
            transform: translateY(-8px);
            border-color: #d4af37;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
        }
        .winner-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .winner-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .game-tag {
            display: inline-block;
            background: linear-gradient(90deg, #aa7c11, #d4af37);
            color: #000;
            font-weight: bold;
            padding: 4px 14px;
            font-size: 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .stars {
            color: #d4af37;
            margin-bottom: 12px;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }
        .winner-review {
            font-style: italic;
            color: #b3b3b3;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ফুটার */
        footer {
            background-color: #0a0a0a;
            color: #777;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            border-top: 1px solid #222;
            font-size: 14px;
        }

        /* মোবাইল স্ক্রিনের জন্য রেসপনসিভ থ্রি-লাইন মেনু */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: linear-gradient(145deg, #141414, #1f1f1f);
                text-align: center;
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
                border-bottom: 2px solid #d4af37;
            }
            .nav-links.active {
                display: flex;
            }
            .nav-links li {
                width: 100%;
            }
            .nav-links li a {
                display: block;
                padding: 15px;
                border-bottom: 1px solid #222;
                color: #d4af37;
            }
            .nav-links li a:hover {
                background: rgba(212, 175, 55, 0.1);
                box-shadow: none;
            }
            
            /* থ্রি-লাইন বাটন অ্যানিমেশন */
            .hamburger.toggle .line1 {
                transform: rotate(-45deg) translate(-5px, 6px);
            }
            .hamburger.toggle .line2 {
                opacity: 0;
            }
            .hamburger.toggle .line3 {
                transform: rotate(45deg) translate(-5px, -6px);
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">MYPLATFORM VIP</div>
            <div class="hamburger" id="hamburgerMenu">
                <span class="line1"></span>
                <span class="line2"></span>
                <span class="line3"></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About Me</a></li>
                <li><a href="#winners">Previous Winners</a></li>
            </ul>
        </nav>
    </header>

    <section id="home">
        <h2 class="section-title">Home</h2>
        <p>মালয়েশিয়ান লটারির অফিশিয়াল লাক্সারি প্ল্যাটফর্মে আপনাকে
