<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Malaysian Lottery & Gaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS RESET & VARIABLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-gold: #ffdf00;
            --dark-gold: #d4af37;
            --rose-gold: #b76e79;
            --bg-dark: #0a0a0c;
            --bg-card: rgba(20, 20, 25, 0.7);
            --text-light: #f5f5f7;
            --glass-border: rgba(212, 175, 55, 0.2);
            --neon-glow: rgba(255, 223, 0, 0.4);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* BACKGROUND AUDIO ELEMENT (HIDDEN) */
        audio {
            display: none;
        }

        /* HEADER & NAVIGATION */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(10, 10, 12, 0.95), rgba(10, 10, 12, 0));
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--neon-glow));
            border-radius: 50%;
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--primary-gold), var(--dark-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .audio-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--primary-gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .audio-toggle-btn.muted i::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 20px;
            background: #ff4444;
            transform: rotate(45deg);
        }

        /* FULLSCREEN LUXURY SLIDER */
        .slider-section {
            position: relative;
            width: 100%;
            height: 75vh;
            overflow: hidden;
            background: #000;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
            z-index: 1;
        }

        .full-slide-layer.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.1);
            transition: transform 6s ease;
        }

        .full-slide-layer.active .slide-bg-img {
            transform: scale(1);
        }

        /* Overlay text dynamic styling */
        .slide-text-overlay {
            position: absolute;
            bottom: 12%;
            left: 8%;
            z-index: 3;
