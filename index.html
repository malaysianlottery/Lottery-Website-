<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysian Lottery - Premium 4D Results & Services</title>
    <style>
        /* ===== GLOBAL RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #FFD700;
            --deep-gold: #C5A059;
            --dark-black: #111111;
            --luxury-dark: #1a1a1a;
            --white: #ffffff;
            --card-bg: #222222;
            --accent-blue: #00CCFF;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Times New Roman', Times, Georgia, serif;
            background: #0d0d0d; 
            color: var(--white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* ===== BULLETPROOF HIGH-DENSITY PARTICLES BACKGROUND (প্রচুর পরিমাণ ক্ষুদ্র কণা) ===== */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1; /* কন্টেন্টের পেছনে থাকবে */
            overflow: hidden;
        }

        /* মাল্টিপল সিএসএস রেডিয়াল গ্রাডিয়েন্ট দিয়ে লাখ লাখ নিখুঁত ও ক্ষুদ্র কণা তৈরি */
        .particles-bg {
            position: absolute;
            width: 100%;
            height: 200%; /* ডাবল হাইট যাতে লুপ অ্যানিমেশন স্মুথ হয় */
            top: -100%;
            background-image: 
                radial-gradient(1px 1px at 10% 10%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1.2px 1.2px at 20% 30%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.5px 1.5px at 35% 15%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1px 1px at 50% 25%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1.3px 1.3px at 65% 35%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1px 1px at 80% 20%, rgba(255, 215, 0, 0.7) 100%, transparent),
                radial-gradient(1.5px 1.5px at 90% 10%, rgba(255, 215, 0, 0.4) 100%, transparent),
                
                radial-gradient(1.2px 1.2px at 15% 55%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1px 1px at 30% 70%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1.5px 1.5px at 45% 60%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1.1px 1.1px at 60% 80%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.4px 1.4px at 75% 65%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1px 1px at 85% 85%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.3px 1.3px at 95% 50%, rgba(255, 215, 0, 0.4) 100%, transparent),

                radial-gradient(1px 1px at 5% 85%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.5px 1.5px at 25% 40%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1.2px 1.2px at 40% 90%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1px 1px at 55% 45%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.4px 1.4px at 70% 95%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1px 1px at 88% 42%, rgba(255, 215, 0, 0.6) 100%, transparent);
            background-size: 300px 300px;
            animation: fallParticles 25s linear infinite;
        }

        @keyframes fallParticles {
            0% { transform: translateY(0); }
            100% { transform: translateY(50%); }
        }

        /* কন্টেন্ট লেয়ার সুরক্ষাকবচ (যাতে কোনো কিছু ব্লক না হয়) */
        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 10;
        }

        /* ===== NAVIGATION BAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #111111;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(197, 160, 89, 0.2);
            border-bottom: 2px solid var(--deep-gold);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 50px;
            width: 50px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
        }

        .logo span {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-gold);
        }

        /* ===== PREMIUM PURE-CSS SLIDER (১০০% সেফ এবং রিলায়েবল) ===== */
        .hero-view-port {
            margin-top: 75px;
            width: 100%;
            height: 550px; 
            position: relative;
            background: #000000; 
            border-bottom: 3px solid var(--deep-gold);
            overflow: hidden;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            opacity: 0;
            animation: cssSliderAnimation 16s infinite ease-in-out;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ৪টি ব্যানারের নিখুঁত টাইমিং ডিলে লজিক */
        .full-slide-layer:nth-child(1) { animation-delay: 0s; }
        .full-slide-layer:nth-child(2) { animation-delay: 4s; }
        .full-slide-layer:nth-child(3) { animation-delay: 8s; }
        .full-slide-layer:nth-child(4) { animation-delay: 12s; }

        @keyframes cssSliderAnimation {
            0% { opacity: 0; }
            4% { opacity: 1; }
            25% { opacity: 1; }
            29% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* ===== SECTION TITLE STYLE ===== */
        .section-title {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: var(--primary-gold);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* ===== PROFILE / AGENT BIOGRAPHY ===== */
        .profile-section {
            padding: 6rem 2rem;
            background: rgba(26, 26, 26, 0.7);
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .profile-image-box img {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            border: 3px solid var(--deep-gold);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .profile-info h2 {
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
            font-weight: 900;
        }

        .profile-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-gold);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--deep-gold);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .profile-info p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #dddddd;
            margin-bottom: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .stat-item {
            background: var(--dark-black);
            padding: 1.5rem;
            border-radius: 6px;
            text-align: center;
            border-top: 3px solid var(--deep-gold);
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-gold);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaaaaa;
            text-transform: uppercase;
        }

        /* ===== PREMIUM SERVICES ===== */
        .services-section {
            padding: 6rem 2rem;
            background: rgba(17, 17, 17, 0.7);
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }

        .services-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 4rem;
        }

        .service-card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
