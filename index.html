<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Malaysian Lottery - Premium Live 4D Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=700;900&family=Poppins:wght=400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== GLOBAL RESET & HIGH-END GOLDEN VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-gold: #FFDF00;     /* Ultra Bright Premium Gold */
            --deep-gold: #D4AF37;        /* Classic Metallic Gold */
            --dark-gold: #996515;        /* Luxury Shadow Gold */
            --pure-black: #000000;
            --card-black: #0d0d11;
            --bright-white: #ffffff;
            --neon-green: #39FF14;
            --neon-blue: #00E5FF;
            --neon-red: #FF3333;
            --gold-glow: rgba(255, 223, 0, 0.35);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: var(--pure-black); 
            color: var(--bright-white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 10;
        }

        /* ===== DEEP GOLDEN HIGH-CONTRAST NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 3px solid var(--primary-gold);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
        }

        .logo span {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF, var(--primary-gold), var(--deep-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav a {
            color: var(--bright-white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-gold);
        }

        .lang-selector-box {
            background: var(--card-black);
            border: 2px solid var(--primary-gold);
            color: var(--bright-white);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        /* ===== HERO AREA FIXED SLIDER ===== */
        .hero-view-port {
            margin-top: 85px; 
            width: 100%;
            max-width: 1400px; 
            margin-left: auto;
            margin-right: auto;
            position: relative;
            background: #111116; 
            border: 3px solid var(--primary-gold);
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out;
            background: #111116;
        }

        .full-slide-layer.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .slide-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 5;
        }

        .slide-text-overlay h1 {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1.15;
            color: var(--bright-white);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.95);
        }

        .slide-text-overlay h1 span {
            display: block;
            background: linear-gradient(135deg, #FFF, var(--primary-gold), var(--deep-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
        }

        /* ===== COMMON GOLDEN HEADLINE HEADER ===== */
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FFF, var(--primary-gold), var(--deep-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* ===== ABOUT PROFILE DATA MATRIX ===== */
        .profile-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 223, 0, 0.25);
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        /* হানিফ সরকার প্রোফাইল ফ্রেম - শ্যাডো/গ্লো রিমুভড ও সলিড ব্ল্যাক */
        .profile-image-box {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid var(--primary-gold);
            margin: 0 auto;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }

        .profile-logo-overlay {
            height: 120px;
            width: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .profile-info h2 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .profile-badge {
            display: inline-block;
            background: rgba(255, 223, 0, 0.1);
            color: var(--primary-gold);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 800;
            border: 2px solid var(--primary-gold);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .profile-info p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #e2e2e8;
            margin-bottom: 1.5rem;
        }

        .condition-highlight {
            border-left: 5px solid var(--primary-gold);
            background: linear-gradient(90deg, #101014, #050505);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 0 12px 12px 0;
            border: 1px solid rgba(255,223,0,0.2);
        }

        .condition-highlight strong {
            color: var(--primary-gold);
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .stat-item {
            background: var(--card-black);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            border: 2px solid rgba(255, 223, 0, 0.2);
            border-top: 4px solid var(--primary-gold);
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-gold);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #b5b5be;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* ===== PREMIUM SERVICES MODULES ===== */
        .services-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 223, 0, 0.25);
        }

        .services-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .service-card {
            background: var(--card-black);
            border-radius: 16px;
            border: 2px solid rgba(255, 223, 0, 0.15);
            padding: 2.5rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-5px);
        }

        .game-logo-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary-gold);
            background: #111;
        }

        .game-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-card h3 { 
            color: var(--primary-gold); 
            font-size: 1.5rem; 
            margin-bottom: 0.8rem; 
            font-weight: 900; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .service-card p { 
            color: #d1d1d6; 
            font-size: 1rem; 
            line-height: 1.6; 
        }

        /* ===== DIGITAL LIVE ARENA ===== */
        .results-section {
            padding: 6rem 2rem;
            position: relative;
            background: var(--pure-black);
            overflow: hidden;
            border-bottom: 2px solid rgba(255, 223, 0, 0.25);
        }

        .results-section-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;
        }

        .live-arena-viewport {
            position: relative;
            z-index: 5;
            max-width: 950px;
            margin: 3rem auto 0 auto;
            background: #000000;
            border: 4px solid var(--primary-gold);
            border-radius: 16px;
            padding: 3rem 2rem;
        }

        .live-header-ticker {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-gold);
            padding-bottom: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .live-status-tag {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 0, 0, 0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            border: 2px solid var(--neon-red);
            font-size: 1rem;
            font-weight: 900;
            color: var(--neon-red);
            text-transform: uppercase;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background-color: var(--neon-red);
            border-radius: 50%;
            animation: pulseBlink 0.8s infinite alternate;
        }
