<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysian Lottery - Premium Live 4D Portal</title>
    <style>
        /* ===== GLOBAL RESET & STRICT SANS-SERIF TYPOGRAPHY ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* LUXURIOUS PROMINENT GOLD GRADIENTS */
            --primary-gold: #FFD700;
            --bright-gold: #FFF5A5;
            --deep-gold: #B8860B;
            --orange-gold: #FFA500;
            --pure-black: #000000;
            --card-black: #0a0a0a;
            --bright-white: #ffffff;
            --neon-green: #00FF66;
            --neon-blue: #00E5FF;
            --neon-red: #FF3333;
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #B8860B 100%);
            --text-gold-gradient: linear-gradient(to bottom, #FFF5A5 0%, #FFD700 50%, #FFA500 100%);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--pure-black); 
            color: var(--bright-white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 10;
        }

        /* ===== HIGH-CONTRAST GOLDEN NAVIGATION BAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 3px solid var(--primary-gold);
            box-shadow: 0 4px 25px rgba(255, 215, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 5px var(--primary-gold));
        }

        .logo span {
            font-size: 1.5rem;
            font-weight: 900;
            background: var(--text-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav a {
            color: var(--bright-white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: var(--primary-gold);
            text-shadow: 0 0 10px var(--primary-gold);
        }

        .lang-selector-box {
            background: var(--card-black);
            border: 2px solid var(--primary-gold);
            color: var(--bright-white);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.2);
        }

        /* ===== BANNER VIEWPORT WITH STRICT STEPPED LINE-BREAKS ===== */
        .hero-view-port {
            margin-top: 85px; 
            width: 100%;
            max-width: 1400px; 
            margin-left: auto;
            margin-right: auto;
            position: relative;
            background: var(--pure-black); 
            border: 4px solid var(--primary-gold);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.25);
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            background: var(--pure-black);
        }

        .full-slide-layer.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* ===== PERFECT STACKED & SEGMENTED MULTI-LINE OVERLAY ===== */
        .slide-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 5;
            opacity: 0;
            transition: opacity 1.2s ease-in-out 0.2s;
        }

        .full-slide-layer.active .slide-text-overlay {
            opacity: 1;
        }

        .slide-text-overlay h1 {
            font-size: 5rem;
            font-weight: 950;
            text-transform: uppercase;
            line-height: 1.05;
            letter-spacing: 4px;
            margin: 0;
            padding: 0;
        }

        .slide-text-overlay h1 span {
            display: block;
            background: var(--text-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 15px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 25px rgba(255, 215, 0, 0.3));
        }

        .slide-text-overlay h1 .line-welcome { font-size: 4.2rem; letter-spacing: 6px; margin-bottom: 0.2rem; }
        .slide-text-overlay h1 .line-to { font-size: 2.8rem; letter-spacing: 4px; margin-bottom: 0.2rem; font-weight: 700; opacity: 0.95; }
        .slide-text-overlay h1 .line-malaysian { font-size: 5.2rem; letter-spacing: 3px; margin-bottom: 0.2rem; }
        .slide-text-overlay h1 .line-lottery { font-size: 5.8rem; letter-spacing: 5px; }

        /* ===== COMMON TITLE CONFIGURATION ===== */
        .section-title {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            background: var(--text-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        /* ===== ABOUT PROFILE SECTION ===== */
        .profile-section {
            padding: 6rem 2rem;
            background: var(--pure-black);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .profile-image-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid var(--primary-gold);
            margin: 0 auto;
            background: var(--pure-black);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .profile-logo-overlay {
            position: absolute;
            width: 75%;
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            filter: drop-shadow(0 0 15px var(--orange-gold));
        }

        .profile-info h2 {
            font-size: 3rem;
            background: var(--text-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .profile-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            color: var(--primary-gold);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 800;
            border: 2px solid var(--primary-gold);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .profile-info p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #eeeeee;
            margin-bottom: 1.5rem;
        }

        .condition-highlight {
            border-left: 5px solid var(--primary-gold);
            background: #0d0d0d;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border-radius: 0 8px 8px 0;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.05);
        }

        .condition-highlight strong {
            background: var(--text-gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin-bottom: 0.4rem;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .stat-item {
            background: var(--card-black);
            padding: 1.5rem;
            border-radius: 6px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-top: 4px solid var(--primary-gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #aaaaaa;
            text-transform: uppercase;
            font-weight: 700;
        }
