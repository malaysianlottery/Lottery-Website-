<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysian Lottery - Premium 4D Results & Services</title>
    <style>
        /* ===== GLOBAL RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #FFD700;
            --deep-gold: #C5A059;
            --dark-black: #111111;
            --luxury-dark: #1a1a1a;
            --white: #ffffff;
            --card-bg: #222222;
            --accent-blue: #00CCFF;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Times New Roman', Times, Georgia, serif;
            background: #0d0d0d; 
            color: var(--white);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* ===== BULLETPROOF TINY PARTICLES LAYER (প্রচুর পরিমাণ ক্ষুদ্র কণা) ===== */
        .particles-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* মাল্টিপল গ্রাডিয়েন্ট লেয়ার দিয়ে পার্টিকেলের সংখ্যা ৪ গুণ বাড়ানো হয়েছে */
            background: 
                radial-gradient(1px 1px at 10% 20%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1.2px 1.2px at 15% 50%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1.5px 1.5px at 30% 70%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1px 1px at 40% 10%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1.2px 1.2px at 50% 40%, rgba(255, 215, 0, 0.7) 100%, transparent),
                radial-gradient(1px 1px at 55% 85%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1.5px 1.5px at 70% 80%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.2px 1.2px at 80% 20%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1px 1px at 90% 30%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1.5px 1.5px at 95% 75%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1px 1px at 25% 15%, rgba(255, 215, 0, 0.5) 100%, transparent),
                radial-gradient(1.2px 1.2px at 35% 85%, rgba(255, 215, 0, 0.4) 100%, transparent),
                radial-gradient(1px 1px at 65% 60%, rgba(255, 215, 0, 0.6) 100%, transparent),
                radial-gradient(1.2px 1.2px at 85% 65%, rgba(255, 215, 0, 0.5) 100%, transparent);
            background-size: 250px 250px;
            animation: superParticleAnimation 20s linear infinite;
            pointer-events: none; /* যাতে মাউস ক্লিকে বাধা না দেয় */
            z-index: 1; /* কন্টেন্টের একদম পেছনে থাকবে */
        }

        @keyframes superParticleAnimation {
            from { background-position: 0 0; }
            to { background-position: 0 -250px; }
        }

        /* কন্টেন্ট লেয়ার সিকিউরিটি (যাতে সবকিছু পার্টিকেলের উপরে ভেসে থাকে) */
        nav, .hero-view-port, section, footer {
            position: relative;
            z-index: 10;
        }

        /* ===== NAVIGATION BAR ===== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #111111;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(197, 160, 89, 0.2);
            border-bottom: 2px solid var(--deep-gold);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 50px;
            width: 50px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
        }

        .logo span {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--primary-gold);
        }

        /* ===== SLIDER MODULE ===== */
        .hero-view-port {
            margin-top: 75px;
            width: 100%;
            height: 550px; 
            position: relative;
            background: #000000; 
            border-bottom: 3px solid var(--deep-gold);
            overflow: hidden;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .full-slide-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            animation: premiumSliderAnimation 16s infinite ease-in-out;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .full-slide-layer:nth-child(1) { animation-delay: 0s; }
        .full-slide-layer:nth-child(2) { animation-delay: 4s; }
        .full-slide-layer:nth-child(3) { animation-delay: 8s; }
        .full-slide-layer:nth-child(4) { animation-delay: 12s; }

        @keyframes premiumSliderAnimation {
            0% { opacity: 0; z-index: 1; }
            4% { opacity: 1; z-index: 5; }
            25% { opacity: 1; z-index: 5; }
            29% { opacity: 0; z-index: 1; }
            100% { opacity: 0; z-index: 1; }
        }

        /* ===== SECTION TITLE STYLE ===== */
        .section-title {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: var(--primary-gold);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* ===== PROFILE / AGENT BIOGRAPHY ===== */
        .profile-section {
            padding: 6rem 2rem;
            background: rgba(26, 26, 26, 0.6);
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .profile-image-box img {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            border: 3px solid var(--deep-gold);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .profile-info h2 {
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
            font-weight: 900;
        }

        .profile-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-gold);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem
